name: macOS

on:
  # Auto-build on push is disabled — every commit on master shouldn't burn
  # 3+ hours of GitHub-hosted runner time. Trigger manually via the
  # "Run workflow" button on the Actions tab, or it'll fire on PR / release.
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ccache:
        description: "Use ccache for the Voxgram build"
        type: boolean
        default: true
  release:
    types: [created]

concurrency:
  # Новый пуш в PR отменяет предыдущую сборку. Кэши при этом всё равно
  # сохраняются (шаги сохранения идут с if: always()).
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    # Universal-сборка (arm64 + x86_64) в одном джобе компилирует каждый
    # файл дважды и на 3-ядерном раннере не укладывается в лимит 6 часов.
    # Поэтому два параллельных джоба, по одному на архитектуру, оба на
    # Apple Silicon (образ macos-13 с Intel GitHub убрал). Библиотеки из
    # prepare.py universal, их кэш у обоих джобов общий.
    #
    # DESKTOP_APP_MAC_ARCH ограничивает архитектуру целевых таргетов
    # (Telegram, td_*), а хостовые утилиты (codegen_*), которые запускаются
    # во время сборки, остаются universal и работают без Rosetta.
    name: macOS ${{ matrix.arch }} build
    runs-on: macos-15
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            mac_arch: arm64
            osx_architectures: arm64
          - arch: x64
            mac_arch: x86_64
            osx_architectures: "x86_64;arm64"

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      USE_CCACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.ccache }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Apply Voxgram RSA public key.
        env:
          VOXGRAM_PUBKEY: ${{ secrets.VOXGRAM_PUBKEY }}
        run: |
          cd "$REPO_NAME"
          if [ -z "$VOXGRAM_PUBKEY" ]; then
            echo "::warning::VOXGRAM_PUBKEY secret is not set — build won't connect to the server."
          else
            printf '%s\n' "$VOXGRAM_PUBKEY" > pubkey.asc
            python3 _apply_pubkey.py
            echo "Public key applied."
          fi

      - name: First set up.
        # Без brew update / brew upgrade: upgrade обновлял все формулы образа
        # и висел часами (из-за него и падал arm64-джоб по таймауту).
        run: |
          sudo chown -R `whoami`:admin /usr/local/share || true

          brew install automake meson nasm ninja pkg-config ccache

          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

          if [ -f /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake ]; then
            sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake
          fi

          echo "CACHE_KEY=$(shasum -a 256 "$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{ print $2 }')" >> $GITHUB_ENV

      - name: Libraries cache.
        # v3 — кэш без дерева сборки Qt. Если найдётся только старый v2,
        # он восстанавливается и пересохраняется уже урезанным.
        id: libs_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-universal-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-universal-libs-v3-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-universal-libs-v3-
            ${{ runner.os }}-universal-libs-v2-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-universal-libs-v2-

      - name: Snapshot prepare cache keys.
        # prepare.py пишет cache_keys/<stage> только после успешной сборки
        # стадии. Запоминаю их до prepare, чтобы потом сохранять кэш только
        # если что-то реально дособралось.
        run: |
          keys() {
            [ -d "$1" ] || return 0
            for f in $(ls "$1" | sort); do printf '%s=%s;' "$f" "$(cat "$1/$f")"; done
          }
          { keys Libraries/cache_keys; keys ThirdParty/cache_keys; } > "$RUNNER_TEMP/cache-keys-before"

      - name: Libraries.
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Trim post-prepare artifacts.
        # Промежуточные объектники библиотек и .git-каталоги не нужны для
        # сборки Voxgram, а кэш раздувают за лимит GitHub. Libraries/local —
        # установленный префикс (в т.ч. Qt с его objects-*/*.o), его не трогаю.
        # Дерево сборки Qt (Libraries/qt_*, ~9 ГБ) после установки в
        # Libraries/local/Qt-* не нужно совсем: очищаю его, оставляя сам
        # каталог — prepare.py по нему и cache_keys считает стадию готовой.
        if: always()
        run: |
          for qt in Libraries/qt_*; do
            [ -d "$qt" ] && [ -f "Libraries/cache_keys/$(basename "$qt")" ] || continue
            find "$qt" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          done
          for dir in Libraries ThirdParty; do
            [ -d "$dir" ] || continue
            find "$dir" -path "$dir/local" -prune -o -type f -name '*.o' -print0 | xargs -0 rm -f
            find "$dir" -path "$dir/local" -prune -o -name .git -prune -print0 | xargs -0 rm -rf
          done
          du -sh Libraries ThirdParty 2>/dev/null || true
          du -sh Libraries/* 2>/dev/null | sort -h | tail -10 || true

      - name: Detect prepare cache changes.
        # Кэш сохраняется отдельным шагом с if: always(), а не post-шагом
        # actions/cache: тот сохраняет только при успехе всего job, и после
        # таймаута сборки следующий запуск собирал все библиотеки заново.
        id: cache_changes
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/cache-keys-before" ] || [ ! -d Libraries/cache_keys ]; then
            echo "prepare did not run, nothing to save"
            exit 0
          fi
          keys() {
            [ -d "$1" ] || return 0
            for f in $(ls "$1" | sort); do printf '%s=%s;' "$f" "$(cat "$1/$f")"; done
          }
          now="$(keys Libraries/cache_keys; keys ThirdParty/cache_keys)"
          before="$(cat "$RUNNER_TEMP/cache-keys-before")"
          if [ -n "$now" ] && [ "$now" != "$before" ]; then
            echo "libs=true" >> $GITHUB_OUTPUT
            echo "Libraries changed, cache will be saved."
          elif [ -n "$now" ] && [[ "$MATCHED_KEY" != "$RUNNER_OS-universal-libs-v3-"* ]]; then
            echo "libs=true" >> $GITHUB_OUTPUT
            echo "Restored an old cache format ($MATCHED_KEY), cache will be saved."
          else
            echo "Libraries unchanged."
          fi
        env:
          MATCHED_KEY: ${{ steps.libs_cache.outputs.cache-matched-key }}

      - name: Save Libraries cache.
        # Библиотеки у обоих джобов одинаковые, сохраняет только arm64, чтобы
        # не заливать один и тот же кэш дважды.
        if: always() && matrix.arch == 'arm64' && steps.cache_changes.outputs.libs == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-universal-libs-v3-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: ccache cache.
        if: env.USE_CCACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}
          # Последний ключ — кэш прежней universal-сборки: в нём объектники
          # под обе архитектуры, так что per-arch сборка тоже из него берёт.
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.arch }}-xcode${{ env.XCODE_VERSION }}-
            ${{ runner.os }}-ccache-xcode${{ env.XCODE_VERSION }}-

      - name: Set up ccache.
        # Xcode-генератор не поддерживает CMAKE_<LANG>_COMPILER_LAUNCHER,
        # поэтому подменяю компилятор через Xcode build settings CC/CXX
        # обёртками над ccache (так же делает React Native). Линкер остаётся
        # обычным clang.
        if: env.USE_CCACHE == 'true'
        run: |
          mkdir -p "$CCACHE_DIR"
          cat > "$CCACHE_DIR/ccache.conf" <<EOF
          base_dir = $GITHUB_WORKSPACE
          max_size = 3G
          compression = true
          depend_mode = true
          file_clone = true
          inode_cache = true
          sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          EOF

          CLANG="$(xcrun --find clang)"
          CLANGXX="$(xcrun --find clang++)"
          BIN="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$BIN"
          # -fno-pch-timestamp делает .pch воспроизводимым, иначе ccache
          # промахивается на всех файлах с precompiled header.
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$CLANG" > "$BIN/ccache-clang"
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$CLANGXX" > "$BIN/ccache-clang++"
          chmod +x "$BIN/ccache-clang" "$BIN/ccache-clang++"

          {
            echo "CCACHE_FLAGS<<EOF"
            echo "-D CMAKE_XCODE_ATTRIBUTE_CC=$BIN/ccache-clang"
            echo "-D CMAKE_XCODE_ATTRIBUTE_CXX=$BIN/ccache-clang++"
            echo "-D CMAKE_XCODE_ATTRIBUTE_LD=$CLANG"
            echo "-D CMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS=$CLANGXX"
            echo "-D CMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO"
            echo "EOF"
          } >> $GITHUB_ENV

          ccache -z
          ccache -p | grep -v "(default)" || true

      - name: Build Voxgram Desktop.
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '17349' }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || '344583e45741c457fe1862106095a5eb' }}
        run: |
          cd $REPO_NAME/Telegram

          ./configure.sh \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          -D DESKTOP_APP_DISABLE_SWIFT6=ON \
          -D TDESKTOP_API_ID=$TDESKTOP_API_ID \
          -D TDESKTOP_API_HASH=$TDESKTOP_API_HASH \
          -D "CMAKE_OSX_ARCHITECTURES=${{ matrix.osx_architectures }}" \
          -D DESKTOP_APP_MAC_ARCH=${{ matrix.mac_arch }} \
          $CCACHE_FLAGS

          cmake --build ../out --config Release --parallel

      - name: ccache stats.
        if: always() && env.USE_CCACHE == 'true'
        run: ccache -s || true

      - name: Save ccache cache.
        if: always() && env.USE_CCACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.arch }}-xcode${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Package artifact.
        run: |
          cd $REPO_NAME/out/Release
          mkdir artifact
          if [ -d "Voxgram.app" ]; then
            mv Voxgram.app artifact/
          elif [ -d "Telegram.app" ]; then
            mv Telegram.app artifact/Voxgram.app
          fi
          [ -f Updater ] && mv Updater artifact/
          lipo -info artifact/Voxgram.app/Contents/MacOS/* || true

          cd artifact
          tar -cJf "voxgram-macos-${{ matrix.arch }}.tar.xz" Voxgram.app Updater 2>/dev/null || tar -cJf "voxgram-macos-${{ matrix.arch }}.tar.xz" Voxgram.app

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: voxgram-macos-${{ matrix.arch }}
          path: ${{ env.REPO_NAME }}/out/Release/artifact/voxgram-macos-${{ matrix.arch }}.tar.xz
          retention-days: 30

      - name: Attach to release.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.REPO_NAME }}/out/Release/artifact/voxgram-macos-${{ matrix.arch }}.tar.xz
